<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Tablica</title>
<meta name="description" content="Tablica, która odpowiada na każde pytanie, rysując krok po kroku. Możesz po niej pisać, a ona odpowiada obok.">
<meta name="theme-color" content="#e9e6df">
<meta property="og:title" content="Tablica">
<meta property="og:description" content="Zapytaj o cokolwiek. Odpowiedź narysuje się krok po kroku.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='6' y='10' width='52' height='40' rx='7' fill='%23fdfdfc' stroke='%2323272d' stroke-width='4'/%3E%3Cpath d='M17 37c6-13 11 6 17-6s8 2 13-7' fill='none' stroke='%2323975a' stroke-width='4.5' stroke-linecap='round'/%3E%3Cpath d='M22 56h20' stroke='%2323272d' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shantell+Sans:wght@400;500;600;700&family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="board/board.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <header class="top">
    <a class="brand" href="./" aria-label="Tablica">
      <svg viewBox="0 0 64 64" aria-hidden="true"><rect x="6" y="10" width="52" height="40" rx="7" fill="var(--card)" stroke="currentColor" stroke-width="4"/><path d="M17 37c6-13 11 6 17-6s8 2 13-7" fill="none" stroke="var(--accent)" stroke-width="4.5" stroke-linecap="round"/><path d="M22 56h20" stroke="currentColor" stroke-width="4" stroke-linecap="round"/></svg>
      <span>Tablica</span>
    </a>
    <div class="top-r">
      <button class="pill" id="history-btn" aria-haspopup="dialog">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 12a8.5 8.5 0 1 0 2.7-6.2"/><path d="M3.5 4.5v5h5"/><path d="M12 7.5V12l3 2"/></svg>
        <span>Poprzednie</span>
      </button>
      <div class="seg" id="theme" role="radiogroup" aria-label="Rodzaj tablicy">
        <button data-theme="white" role="radio">Biała</button>
        <button data-theme="chalk" role="radio">Kredowa</button>
      </div>
    </div>
  </header>
  <main>
    <div id="board" data-theme="white"></div>
    <div class="ideas" id="ideas" hidden></div>
  </main>
</div>
<div class="drawer-bg" id="drawer" hidden>
  <aside class="drawer" role="dialog" aria-label="Poprzednie tablice">
    <header><h2>Poprzednie tablice</h2><button class="x" id="drawer-x" aria-label="Zamknij"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></header>
    <div class="drawer-list" id="drawer-list"></div>
  </aside>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
